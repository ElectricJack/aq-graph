name: CI
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: aq_graph
          POSTGRES_PASSWORD: test-only-ci-password
          POSTGRES_DB: aq_graph_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aq_graph -d aq_graph_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://aq_graph:test-only-ci-password@127.0.0.1:5432/aq_graph_test
      AQ_GRAPH_TEST_DATABASE_URL: postgres://aq_graph:test-only-ci-password@127.0.0.1:5432/aq_graph_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: python3 scripts/check-parity-map.py
      - run: python3 -m compileall -q scripts examples
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: for script in scripts/*.sh; do bash -n "$script"; done

  deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: aq-graph:validation
          cache-from: type=gha,scope=aq-graph-linux-amd64
          cache-to: type=gha,mode=max,scope=aq-graph-linux-amd64
      - name: Isolated deployment and recovery drill
        env:
          AQ_GRAPH_SMOKE_IMAGE: aq-graph:validation
          AQ_GRAPH_SMOKE_SKIP_BUILD: '1'
        run: python3 scripts/deployment-smoke.py
