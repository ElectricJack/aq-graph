name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  binaries:
    needs: checks
    strategy:
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, artifact: linux-x86_64}
          - {os: macos-15, target: aarch64-apple-darwin, artifact: macos-aarch64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify release version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Release tag must match Cargo package version'
          PY
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.96.1
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/aq-graph dist/
          cp README.md dist/
          mkdir dist/docs
          cp docs/api.md docs/openapi.json docs/operations.md dist/docs/
          python3 - <<'PY'
          import json, os
          with open('dist/COMPATIBILITY.json', 'w') as output:
              json.dump({'release':os.environ['RELEASE_TAG'],'api_version':1,'schema_version':8}, output, indent=2)
          PY
          archive="aq-graph-${RELEASE_TAG}-${{ matrix.artifact }}.tar.gz"
          tar -C dist -czf "$archive" .
          shasum -a 256 "$archive" > "${archive}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aq-graph-${{ matrix.artifact }}
          path: aq-graph-*.tar.gz*
  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: aq-graph-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push release image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          build-args: AQ_GRAPH_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=aq-graph-linux-amd64
          cache-to: type=gha,mode=max,scope=aq-graph-linux-amd64
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.aq-graph.api-version=1
            io.aq-graph.schema-version=8
      - name: Record pushed image identity and provenance
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          python3 scripts/release-evidence.py --output release-evidence \
            --image "$IMAGE_NAME" --digest "$IMAGE_DIGEST" \
            --tag "$RELEASE_TAG" --revision "$SOURCE_REVISION"
          {
            echo '### Released image (linux/amd64)'
            echo '```'
            cat release-evidence/image-reference.txt
            echo '```'
            echo '### Source and build provenance'
            echo '```json'
            cat release-evidence/release-provenance.json
            echo '```'
          } > release-evidence/notes.md
          cat release-evidence/notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aq-graph-release-evidence
          path: release-evidence/
          if-no-files-found: error
      - name: Release archives and image evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/* \
            release-evidence/release-provenance.json release-evidence/image-reference.txt release-evidence/Cargo.lock \
            --verify-tag --generate-notes --notes-file release-evidence/notes.md
