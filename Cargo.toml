[package]
name = "aq-graph"
version = "0.1.1"
edition = "2024"
description = "Standalone task and knowledge graph service"

[workspace]
members = ["."]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true

# CI-only images (the CI deployment drill): no ThinLTO, low optimization.
# Release images and archives keep [profile.release].
# Dropping ThinLTO alone saves nothing on a 4-vCPU runner (LTO builds
# dependencies as bitcode and generates code once); the optimization level is
# the lever (aq-server: 796 s release, 793 s without LTO, 445 s with workspace
# opt-level 0 and dependencies 1). Debug assertions stay off, as in release.
[profile.ci-image]
inherits = "release"
lto = false
opt-level = 0
codegen-units = 16

[profile.ci-image.package."*"]
opt-level = 1
